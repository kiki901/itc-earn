name: hamster_points
description: تطبيق نقاط افتراضية مع مزارع حيوانات
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # ─── State Management ───
  provider: ^6.1.2

  # ─── URL Launcher ───
  url_launcher: ^6.3.1

  # ─── Share ───
  share_plus: ^10.1.4

  # ─── Image Picker ───
  image_picker: ^1.1.2

  # ─── Local Storage ───
  shared_preferences: ^2.3.3

  # ─── Intl ───
  intl: ^0.19.0

  # ─── Animations ───
  flutter_animate: ^4.5.0

  # ─── Shimmer Loading ───
  shimmer: ^3.0.0

  # ─── Crypto Hashing ───
  crypto: ^3.0.3

  # ─── HTTP Client ───
  http: ^1.2.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/icon.png"
  adaptive_icon_foreground: "assets/icon/foreground.png"
  adaptive_icon_background: "#1A237E"
  background_color: "#1A237E"

flutter:
  uses-material-design: true
